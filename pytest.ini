[pytest]
# BOTH halves of addopts are load-bearing; neither is decoration.
#
#   -p no:randomly     pytest-randomly reseeds every test, which conflicts with
#                      seeded state this suite depends on. It is installed in
#                      this environment, so omitting this CHANGES behaviour.
#   -m "not isolated"  `@pytest.mark.isolated` marks tests that are flaky only
#                      alongside the full suite (see test_crash_safety.py). They
#                      are run in a dedicated process, never here.
#
# Until 2026-08-27 this file did not exist: `autoloop/tests` was run from the
# parent repository, whose root pytest.ini supplied both flags. The split made
# that inheritance invisible, so it is restated here.
addopts = -p no:randomly -m "not isolated"
testpaths = autoloop/tests
markers =
    isolated: run in a dedicated pytest process; flaky only alongside the full suite
