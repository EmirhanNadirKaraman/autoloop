# Autoloop configuration template.
# Copy to .autoloop/config.toml (the default path `python -m autoloop` reads)
# and fill in paths.workers_root. Unknown keys are rejected, not ignored.

# NO [browser] SECTION. As of brw-16 (2026-08-25) no browser-backed conversation
# provider is registered, so there is nothing for one to configure and this
# template no longer ships it. Two things follow, and both are deliberate:
#
#   * A config that STILL HAS a [browser] section keeps loading, unchanged and
#     unread. Every key is still accepted and still validated; none of them is
#     required, including conversation_url. Upgrading a running deployment does
#     not mean editing a file first — delete the section when convenient, or
#     never. brw-19c (2026-08-31) removed the last preflight that graded any of
#     those values and did NOT remove a single key.
#   * If you register a browser-backed adapter of your own
#     (`conversation.register_provider(name, factory, browser_backed=True)`),
#     the section and every timeout, restart and rate-limit setting in it come
#     back exactly as they were — see autoloop/config.py's BrowserConfig for the
#     full list of keys and their defaults. The orchestrator's restart, cooldown
#     and rate-limit recovery is untouched and still reads them.
#
# What you must SUPPLY yourself, if you do that: the browser DRIVER. The
# implementation this project shipped is being removed, so browser.cdp_url has
# to point at a browser you launched and browser.restart_command has to be your
# own command — the loop neither ships nor recommends one, and an empty
# restart_command simply means "no auto-restart", exactly as it always did.
# `python -m autoloop doctor` no longer probes CDP or imports playwright, so it
# reports nothing about a browser either way; `python -m autoloop start` still
# runs a declared restart_command when the CDP endpoint is silent.

[policy]
max_iterations = 20
max_consecutive_failures = 3
# INERT since brw-15 (2026-08-25) removed conversation rotation, and doubly so
# since brw-16 removed the [browser] section this sentence names: nothing spends
# this budget any more and a wedged conversation simply parks. The key is still
# accepted and `PolicyEngine.check_rotation_budget` still reads it, so it is left
# here rather than becoming an unknown-key refusal on an existing config. It used
# to bound how many times ONE run could abandon a wedged conversation for a fresh
# chat in browser.project_url. `doctor` reported the budget until brw-19c
# (2026-08-31) and no longer reports anything about a browser at all.
max_conversation_rotations = 1
# How many times ONE run may hand the reviewer role to
# conversation.fallback_provider after an exhausted allowance. One is enough:
# the useful move is primary -> fallback, and switching back would need a quota
# window to have reset, which does not happen inside a single run.
max_provider_switches = 1
# How many consecutive browser failures may go unrecovered because
# browser.restart_cooldown_seconds refused their restart. Those failures do NOT
# spend max_consecutive_failures above — a restart that never ran is no evidence
# that restarting fails — so this is what stops them retrying forever. Reaching
# it parks with a question naming the cooldown, rather than failing silently.
max_browser_restart_skips = 5
# How many consecutive back-offs the loop may take against ChatGPT's account
# rate limit before parking. Like the setting above these do NOT spend
# max_consecutive_failures — the loop cannot recover from a server-side limit,
# only outlast it, so a wait is evidence about the account, not the transport.
# Six waits on the default schedule is 60+120+240+480+600+600 = 2100 seconds,
# i.e. 35 minutes; exhausting it parks with a question naming the throttle
# instead of "browser session lost".
max_rate_limit_backoffs = 6
max_parse_retries = 2
max_policy_denials = 3
allow_commit = true
allow_push = true
# Direct pushes to these branches are denied. This repo commits to `main`
# today — either empty this list or set allow_protected_push = true once you
# trust the loop; the safe default stays on.
protected_branches = ["main", "master"]
allow_protected_push = false
# Merge a completed task's published side branch into the base and push the
# base, immediately after the task is retired. OFF by default: it is the only
# setting that moves the shared branch head with no operator in the loop.
#
# It is gated on exactly the same predicate `python -m autoloop merge-window`
# reports — no unpublished candidate bound to the current base, no executing
# phase — because moving the head strands any task whose reviewed candidate is
# pinned to it. When the gate is shut the merge is DEFERRED (recorded under
# <state_dir>/merge-deferrals/ and retried after the next completion), never
# forced and never parked. Conflicts abort cleanly and name the files.
#
# If your base branch is in protected_branches above, the merge still happens
# locally but the push is refused until allow_protected_push = true. That
# pairing is deliberate: turning this on is not by itself permission to push
# `main`.
#
# The SAME flag also enables the backlog sweep (`merge_sweep.py`): at startup,
# and from `python -m autoloop merge-backlog`, every completed task whose
# published branch is not an ancestor of the base head is merged, oldest
# publication first, stopping at the first branch that does not land. That is
# the half auto-merge cannot cover — a branch published before it existed has
# no completion event left to react to, which is how seven finished tasks sat
# unmerged on 2026-08-06. Same gate, same rules, same off-by-default.
auto_merge_enabled = false
# Note: force pushes and destructive git commands (reset/clean/rebase/...)
# cannot be enabled by ANY setting — the git whitelist has no knob for them.

[codex]
# The Codex CLI reviewer. Only read when a codex provider is selected above.
# Codex signs in with your ChatGPT plan (`codex login`) — no API key. Run
# `python -m autoloop doctor` after changing anything here: it resolves the
# command, grades the sandbox policy and the working directory, and makes ONE
# trivial invocation from that directory under that policy, which is the only
# thing that answers "would a review work".
command = ["codex", "exec"]
# THE CONFINEMENT, and no longer empty. These flags go between `command` and
# the prompt on every invocation — the review turn and doctor's preflight, from
# this one setting.
#
# `--sandbox read-only` because the reviewer answers from a self-contained
# packet: it needs no writes, no commands and no repository. That is what the
# seat NEEDS, not what the mode refuses — read-only does not refuse commands;
# see below. An empty list here
# is NOT a policy — it asks for no sandbox at all — so autoloop REFUSES to run
# the reviewer under one: `doctor`'s `codex_sandbox` row fails, the preflight
# makes no invocation, and `SubprocessCodexRunner.run` raises rather than
# launching. Same for a bypass flag (`--dangerously-bypass-approvals-and-sandbox`,
# `--yolo`) or a mode autoloop cannot name; `--sandbox workspace-write` is
# allowed with a warning.
#
# What this buys, stated exactly: the flags are PRESENT in the invocation, and
# doctor's preflight proves YOUR build accepts them (no codex binary runs in the
# autoloop repository or its CI, so nothing else can be verified there — check
# `codex exec --help` if your build spells them differently, and a flag it
# rejects fails that check rather than your first review). Enforcement is
# codex's own, and read-only restricts WRITES. It is NOT a no-command sandbox —
# the reviewer can still run commands under it, sandboxed rather than refused —
# and it does not stop it READING files. Whether the mode also closes the
# network is codex's behaviour and is not verified here, so it is not claimed.
# Nothing in the loop depends on any of that.
#
# `--skip-git-repo-check` can be added alongside: it accepts an untrusted
# working directory, and it switches codex's own guard off everywhere. Trusting
# the directory once (below) is the better fix. It names no sandbox mode, so it
# neither provides nor weakens the policy above.
sandbox_args = ["--sandbox", "read-only"]
timeout_seconds = 900.0
# Where the CLI runs. NOT the confinement — that is `sandbox_args` above; a
# working directory chooses where a process STARTS and refuses nothing, not an
# absolute path, not `..`, not a subprocess.
#
# Empty = `~/.autoloop/codex-workdir`, a dedicated empty directory autoloop
# creates on first use. TRUST IT ONCE — `cd ~/.autoloop/codex-workdir && codex`
# — or codex refuses: it declines to run outside a trusted directory
# ("Not inside a trusted directory and --skip-git-repo-check was not
# specified"). That refusal is a guard worth keeping, which is why the default
# is one empty directory rather than your home directory (untrusted, and
# trusting it would trust every file you own) and rather than the flag above.
#
# Never point this at the repository: the prompt is self-contained, so the
# reviewer has no business being started in the tree it is grading. `doctor`
# fails if it is inside. A CONFIGURED directory that does not exist is refused,
# never created, so a typo here cannot become the place your reviews run —
# CONFIGURED meaning this line is non-empty. Writing the default path out
# ("~/.autoloop/codex-workdir") therefore opts OUT of having it created: leave
# the value empty if you want autoloop to provision it.
working_dir = ""
# Substrings that mark a SPENT ALLOWANCE in a FAILED invocation — the window is
# used up, waiting does not help, and the loop hands the reviewer role to
# `conversation.fallback_provider` or parks. Empty uses the built-in list.
#
# Every non-zero exit writes a `codex_invocation_failed` record to the
# transcript carrying the return code, the classification and a bounded excerpt
# of what codex printed, so the first real exhaustion shows you exactly what to
# add here — a config edit, not a code change.
#
# Safe to widen. A marker is ignored when the prompt accounts for it — either
# because it occurs in the text that was sent, or because it sits on an output
# line that does. `codex exec` echoes the whole prompt back on stderr, so before
# that guard existed a review packet quoting a line number like `docs/x.md:4295`
# made any failure read as an exhausted account and parked the loop (twice, on
# 2026-08-22, against an account 4% through its weekly window). Both comparisons
# ignore whitespace and punctuation, so an echo codex re-wraps is still ignored.
# Suppressed markers are named in the record, together with `echo_lines_dropped`
# and `prompt_guard`, so the guard is visible rather than silent.
quota_patterns = []
# Substrings that mark a TRANSIENT throttle — the account is being asked to
# slow down and the remedy is time. Empty uses the built-in list, which is where
# "429", "too many requests" and "rate limit" live. Kept apart from
# `quota_patterns` on purpose: these never park the loop, because a
# thirty-second limit routed to the permanent branch is a false outage.
rate_limit_patterns = []
#
# The two keys below are the same distinction for the OTHER codex transport,
# `conversation.provider = "codex_app_server"`. That one classifies from a named
# field on a JSON-RPC error object rather than from printed text, so there is no
# echo to guard against — and no guard either, which is why misfiling a code
# between these two lists is the mistake to avoid. Both empty = the built-in
# lists, which are split correctly. A list that would recognise nothing — []
# or [""] alike — falls back to the built-in one rather than switching the
# check off, and misfiling a SPENT marker into the transient list cannot
# downgrade a real exhaustion, because spent is tested first.
#
# Error TYPES that mean a SPENT allowance. A value here reaches the loop_fatal
# park, exactly as `quota_patterns` does. Do not put a throttle code here.
quota_error_codes = []
# Error TYPES that mean a TRANSIENT throttle. These stay on the ordinary
# retryable failure budget. The numeric HTTP status 429 is recognised as a
# throttle without being listed, and is deliberately NOT an exhaustion.
rate_limit_error_codes = []

[conversation]
# Which LLMConversation adapter holds the reviewer role (see
# autoloop/conversation.py). Built in: "codex_cli" (Codex CLI, one process per
# turn) and "codex_app_server" (one `codex app-server` process holding one
# thread, so it can deposit an oversized diff as numbered parts). Neither drives
# a browser, so none of the DOM transport's ambiguity machinery is reachable at
# all. Further adapters register here without orchestrator changes.
#
# "browser_chatgpt" was RETIRED on 2026-08-25 and is not registered. A config
# still naming it here LOADS and prints a notice saying so; the run then refuses
# at transport construction rather than reviewing on a transport you did not
# choose. Change it to one of the two above.
#
# THE CEILING NEITHER OF THEM RAISES. Codex signed in with a ChatGPT account
# (verified 2026-08-17: `stored API key: false`, `auth mode: chatgpt`) draws on
# the SAME allowance the retired browser provider used. Switching transport
# removed the DOM faults — 21 of this loop's first 103 blockers — and removed
# nothing about the account rate limit that parked the loop for four hours on
# 2026-08-17. Neither codex seat has a budget of its own; see
# docs/AUTOLOOP.md's "Selecting the codex reviewer".
provider = "codex_cli"
# Where the reviewer role goes when `provider` reports its allowance exhausted.
# Empty disables failover and the loop parks instead, which is the default and
# is currently the honest setting.
#
# Failover only buys something when the two transports draw on DIFFERENT
# budgets. That used to be true of codex_cli -> browser_chatgpt: Codex spends
# your ChatGPT plan's AGENTIC allowance (shared with ChatGPT Work and ChatGPT
# for Excel) while ordinary ChatGPT conversations spend a separate quota. With
# the browser seat gone, the only remaining pairing is the two codex transports,
# which share ONE allowance — so naming one as the other's fallback fails over
# to the same wall.
#
# A config still naming "browser_chatgpt" here is read as "" for the run, with a
# notice: nothing validates a fallback name until the handover actually happens,
# so leaving it would switch the reviewer role to an unregistered transport and
# only then fail to build it.
#
# When it is set, the handover is bounded (policy.max_provider_switches), only
# happens with no captured reply in flight, and is recorded on the request and
# the response, so a `reviewed` stamp always says which reviewer produced it.
fallback_provider = ""

[executor]
# "audit" = the real Phase-3 audit executor (read-only claude-CLI subagents,
# Markdown-only output). "null" = record directives without executing (dry run;
# `run --null-executor` overrides per-invocation).
kind = "audit"

[audit]
# How subagents are launched (the Claude Code CLI in headless mode).
agent_command = ["claude"]
#
# `agent_timeout_seconds` was RETIRED on 2026-08-14. It bounded every agent by
# elapsed time, which cannot tell a large task from a wedged one — measured
# over 2026-08-05/06 it never once caught a hung agent and killed six agents
# mid-write, discarding up to 631 insertions at a time. It splits into three
# settings that mean different things.
#
# A config still naming it LOADS, and is handled explicitly rather than
# ignored: the value migrates onto `audit_agent_timeout_seconds` below (the one
# replacement that keeps its exact meaning) and the loop prints a notice on
# stderr, once per process, saying so. It does NOT carry over to the
# write-capable agent — that path is bounded by silence now, not by elapsed
# time. If `audit_agent_timeout_seconds` is also set, that wins and the notice
# says the legacy value was dropped. Delete the old key to silence the notice.
#
# READ-ONLY audit agents: an elapsed bound, the old key's exact meaning and
# value. Correct here — they change no files, so there is no progress to
# observe, and a timeout costs a re-run rather than destroying work.
audit_agent_timeout_seconds = 900.0
# WRITE-CAPABLE implement agents: how long the worker repository may show NO
# change at all before the agent counts as hung and is killed. A silence
# window, NOT a time budget — while files keep changing the agent keeps
# running, however long the task takes. Keep it generous: a long compile or a
# long test run is not a stall, and killing a healthy agent is the failure
# this replaced.
agent_stall_seconds = 1800.0
# The absolute backstop, for every agent, set far above any real task. It
# should effectively never fire; if it does, the report says so loudly and
# that is worth investigating rather than tuning away. Must be strictly above
# agent_stall_seconds, or the stall detector could never run.
agent_ceiling_seconds = 14400.0
max_parallel_agents = 3
# Safe validation commands run before the agents (argv lists; binaries are
# restricted to ruff/pytest/python/npm/npx/tsc — nothing that mutates). This is
# also the DEFAULT for post-commit validation: every task that declares no
# `validation` of its own has its committed tree graded by exactly this list,
# re-run in full on EVERY round, including the rounds that end in a revise.
#
# Each command is reported separately ("<command>: PASS" / ": FAIL (<digest>)"),
# so keeping the trees on separate lines keeps a failure attributable to one of
# them rather than to "pytest".
#
# THE ORDER OF THIS LIST IS LOAD-BEARING as of val-03 (2026-08-22). A validation
# run STOPS at the first command that fails and reports every command after it as
# "<command>: NOT RUN" — a run answers "is this approvable?", and the first
# failure settles that, so everything after it is bought against a verdict
# already reached.
#
# So order these cheapest-first, which is what the list already is: lint
# (seconds) before the test suites (minutes), and the serial `isolated` re-run —
# the one command that cannot be parallelised — last. Nothing re-orders this list
# for you; a list written expensive-first would simply pay expensive-first. The
# two pytest suites' order relative to each other is left to you, deliberately:
# it needs a measurement this file cannot make for your repository.
#
# NOT RUN is not SKIPPED (that is test selection, below), the summary still names
# every configured command either way, and nothing about the VERDICT changes.
# There is deliberately no key here to turn it off; the full-run mode is
# `run_validation_commands(..., fail_fast=False)`. See docs/AUTOLOOP.md §4h.
#
# Three things on the pytest lines are load-bearing:
#
#   * `-n auto` — pytest-xdist, one worker per core. Run serially the two suites
#     cost minutes of wall clock per round, paid against a change that usually
#     touches two or three files. Needs `pytest-xdist` installed in the
#     interpreter the loop invokes (root `requirements.txt` pulls it in via
#     `lexy-app/backend/requirements.txt`); without it pytest exits 4 on an
#     unrecognised argument and EVERY task fails validation, so check that
#     first if validation starts refusing everything at once.
#
#   * `-p no:cacheprovider` — pytest writes `.pytest_cache/` the moment a test
#     fails. Post-commit validation runs inside the task's own worker repo and
#     the gate after it refuses a worktree validation dirtied, so one failing
#     test produced two refusals instead of one (2026-08-03). Disabling the
#     plugin keeps a failing run from mutating the tree it is grading.
#
#   * the last line runs the `isolated` marker, alone and SERIALLY. `pytest.ini`
#     deselects that marker from every default run, so without a dedicated
#     command the coverage silently disappears; and it stays off `-n auto`
#     because the marker means "this test needs its own process", which is the
#     one thing a shared parallel run cannot give it.
#
# Both flags are also applied AT RUN TIME by `autoloop/validation.py`
# (`effective_validation_commands`), to whatever list is configured here, to a
# task's own declared `validation`, and to command lists persisted by sessions
# that dispatched earlier. Nothing re-reads this template after you copy it, so
# a config.toml written before a flag existed would otherwise never gain it.
# Spelling them out here anyway keeps the file readable as what it does; a
# command that already says `-n 0`, `-n 4` or `--numprocesses` is left exactly
# as written, and marker selection is never rewritten.
validation_commands = [
  ["ruff", "check", "."],
  ["python3", "-m", "pytest", "autoloop/tests", "-q", "-n", "auto", "-p", "no:cacheprovider"],
  ["python3", "-m", "pytest", "tests/", "-q", "-n", "auto", "-p", "no:cacheprovider"],
  ["python3", "-m", "pytest", "autoloop/tests", "-q", "-m", "isolated", "-p", "no:cacheprovider"],
]
# WHICH of those tests a per-commit run executes. "reachable" (the default)
# narrows each pytest command above to the test files the commit's own changed
# paths can reach through the repository's import graph; "full" disables
# selection and runs every command exactly as written.
#
# Not filename similarity, and that distinction is the whole point. On
# 2026-08-06 auto-01's candidate f06454b5 changed 16 files and updated the four
# test files it touched — every failure was in autoloop/tests/test_v1_smoke.py,
# which that commit never touched. It imports autoloop.publisher directly, so a
# reachability model selects it and a name-matching one ships the regression.
#
# An import name is read in the importing FILE's context, not only at the repo
# root. autoloop/tests/ has no __init__.py, so pytest puts that directory on
# sys.path and its modules import each other by bare name (subtitle-scraper/ does
# the same through sys.path.insert); resolving only full dotted names dropped
# those edges silently, and a change to an imported test helper then omitted the
# untouched modules that run it. When one bare name could mean two files, every
# candidate gets an edge — over-running a test is recoverable, skipping one is not.
#
# A BOUND ON THE SAVING, so the numbers in the summary are not a surprise:
# autoloop/tests/conftest.py imports autoloop.orchestrator, and a conftest counts
# as imported by every file beneath it, so a change to almost any autoloop module
# selects the whole autoloop/tests tree. That is sound — those tests really do
# execute that conftest — and what such a round saves is the OTHER commands above
# (the root tests/ suite, the isolated re-run) being skipped as unreachable.
#
# Selection only ever narrows when it can prove the narrowing; everything else
# widens to the whole suite. A commit touching a non-Python file (a .toml a test
# reads, a fixture, docs), an unparseable module, a checkout too large to parse,
# or a reachability result of zero test files all run the full list. Test files
# that reach repository code without importing it — a dynamic import, a spawned
# interpreter — are selected on EVERY change rather than reasoned about. Non-test
# commands (`ruff`) are never touched and always run in full.
#
# That rule covers the COMMANDS above as well as the code they run. A pytest
# command this selector cannot rewrite without guessing which of its tokens are
# test paths — one carrying a flag it does not know, one declaring no paths at all
# (its surface then comes from pytest.ini's testpaths), or one aimed at a node id,
# a glob or an absolute path — widens the WHOLE round back to the list above,
# rather than running that one command in full while the summary calls the round a
# subset. The four commands shipped here are all narrowable; a command you add
# that is not will simply turn selection off, visibly, and say which one did it.
#
# WHICH RUNS this governs, as of val-04 (2026-08-27): BOTH runs of a round. It
# was the post-commit re-run only from 2026-08-20 until then. A round validates
# twice — once inside ImplementExecutor before the commit, from that tree's own
# dirty paths, and once against the committed worktree, from git's account of the
# commit range — and this one setting is read by both (cli._build_executor passes
# it to the executor as well), so "full" restores the pre-2026-08-20 behaviour at
# both ends rather than at one. A round no longer costs one full suite plus one
# narrowed suite: no full-suite run is guaranteed at either phase, and a round
# that narrows at both has none. The pre-commit run is therefore no longer an
# independent backstop under the post-commit one — what the later run still adds
# is its SUBJECT, the committed tree a commit hook can have changed.
#
# Whatever it decides is recorded in the validation summary the reviewer reads,
# naming the selected files, the changed paths they were selected from, and the
# basis — so a narrower run still has to justify itself. Two ways to force the
# full suite, and BOTH are operator edits — a `plan` directive can set neither,
# since `contract._TASK_SPEC_KEYS` carries no `validation` key: set this to
# "full", or give the task its own `validation` commands in tasks.json (a
# declared list is run exactly as declared, and a declared `validation_cwd` is
# never narrowed either). A reviewer who wants a full run therefore has to ask
# for one; there is no directive field that grants it.
test_selection = "reachable"

[autonomy]
# What the loop does when a TRANSPORT or ENVIRONMENT fault would otherwise park
# it for a human (halt-02, 2026-08-25). The whole section is optional and the
# default below is OFF, so omitting it — which every config file written before
# this existed does — behaves exactly as the loop always has: each such fault
# parks, and the classification each park site chose for itself stands.
#
# Measured 2026-08-24 over 131 resolved blocker records: 411.8h parked, and over
# the 70.3h window where every round is timed, 21.5h (30.6%) was the loop waiting
# for an operator, in five gaps out of 103. A transport or environment fault is
# the worst of those waits because there is nothing to decide — the loop already
# knows the remedy and simply will not move without being told.
#
# With `enabled = true`, a fault whose code is in autoloop/blockers.py's
# AUTONOMOUS_RECOVERIES gets two stages instead of a park: it re-enters the
# recovery path that already exists (a `--retry` phase re-entry, or a
# `--resubmit` re-issue of the same request id), bounded and durably counted;
# and when that path is exhausted the ONE task in flight is set aside — the same
# quarantine `run --continuous` already works past — so the loop keeps going on
# the rest of the roadmap. A blocker record is written either way, so nothing
# becomes invisible: `python -m autoloop blockers` still lists it, and a record
# whose fault the loop recovered from is closed with a machine reason rather
# than a forged operator answer.
#
# WHAT IT CANNOT REACH, whatever this is set to: checkout_escape_detected,
# worker_isolation_violation, primary_checkout_dirty,
# approved_path_symlink_traversal and prompt_integrity_mismatch. Those mean an
# agent wrote outside its worker repository or the checkout is not what the loop
# believes it to be, and continuing past one corrupts the tree every later task
# builds on. They are an explicit refusal in `blockers.autonomous_recovery`, not
# an omission from a list.
#
# It also never publishes and never re-provisions anything. `publisher_url_drift`
# is in the table with a budget of ZERO precisely because its only recovery is
# `reprovision-publisher --confirm` — an operator confirming that a new push
# destination is correct — so it is set aside without a retry and nothing is
# pushed.
#
# THE SECOND HALF (halt-03, 2026-08-25): STALE RECORDS, rebuilt at the current
# head. Six more codes — task_base_behind_head, push_candidate_stale,
# push_candidate_unresolvable, state_inconsistent, audit_revise_no_record and
# changeset_binding_missing — whose fault is not a transport fault at all but a
# record the loop is still holding that no longer describes anything. Each of
# them ARCHIVES that record, REBUILDS at the current head and RE-DISPATCHES,
# which is exactly what an operator does by hand today: measured 2026-08-24,
# task_base_behind_head was the second largest cause of parked time (15 parks,
# 18.5h) at a MEDIAN of 0.54h — cleared as fast as it was seen.
#
# NOTHING IS DELETED. An execution record is archived to executions/archive/ and
# its worker repository quarantined, both under one label, through the same
# `release_task_to_pending` path the reviewer's `recut` uses — with the same
# refusals (a published candidate, a candidate whose verdict is still in flight,
# a record that cannot be read, an operator hold) and the same per-task cap. A
# session pointer that has no on-disk form is written to the transcript before
# it is cleared, so an operator's queued `review-changeset` can never evaporate
# with nothing saying so. Any refusal falls through to the park the loop has
# today, with the question it always had, and says so in the transcript.
#
# NOTHING AN OPERATOR QUEUED IS DROPPED TO GET THE LOOP MOVING EITHER.
# changeset_binding_missing is the one code here whose stale record is the
# PACKET rather than the record it names: the queued review stays exactly as it
# was and the packet is re-rendered from the immutable git objects, so the next
# round presents the same candidate under a binding an approval can still
# resolve. The four identifiers are read only off the queued entry — never
# re-derived from the checkout's current branch, which could rebind a candidate
# to a destination nobody named — and a packet that cannot be rendered, or that
# comes back without them, parks instead of being sent.
#
# The one path that CAN drop a queued review is the changeset arm of
# push_candidate_unresolvable, and it acts only on git's own answer: the
# repository must report that its object database does not hold the reviewed
# candidate. No gateway to ask, a probe that died, a checkout that is not there,
# an entry nothing can read or one naming no candidate at all are UNANSWERED
# questions rather than answers, and each parks with the review exactly where it
# was. That record exists nowhere else once the state file is rewritten, so it is
# destroyed on evidence or not at all.
#
# AND NOTHING IS LEFT UNPUBLISHABLE. The two push_candidate_* codes hold a stale
# APPROVAL BINDING rather than a record, and dropping one is only half a remedy:
# the candidate the task still holds would have no packet a later approval could
# name, so the loop would have moved while making the operator's job harder.
# Both instead RE-PRESENT that candidate — a freshly rendered review packet,
# checked before it is sent to carry everything the next round binds on — so the
# very next verdict can publish it. Where nothing can be re-presented because the
# recorded candidate itself no longer resolves, the record is archived and the
# task requeued through the same path as above, never re-dispatched blind.
#
# THE THIRD HALF (halt-01, 2026-08-26): an EXHAUSTED BUDGET OR CEILING sets its
# own task aside. A budget means "stop churning on THIS task", not "stop
# everything" — and six of these seven codes stop everything today.
# attempt_count_ceiling, review_round_cap, parse_budget_exhausted,
# plan_denial_budget_exhausted, policy_denial_budget_exhausted,
# review_mismatch_budget_exhausted and git_failure_budget_exhausted each record
# the reason exactly as now, quarantine the ONE task in flight, and let
# `run --continuous` pick up the next ready task with no operator. Nothing is
# retried for any of them: a counter that reached its limit is not a transient
# fault, so every one carries a retry budget of ZERO and max_recovery_attempts
# below cannot change that. attempt_count_ceiling composes with the reviewer
# classification it already asks for — ask first, set aside only when that
# answer does not resolve it — and it, like review_round_cap, already
# quarantined its own task, so for those two nothing changes in either position
# of this flag.
#
# THE SESSION CEILING IS NOT IN IT, on purpose. iteration_budget_exhausted
# counts the RUN's iterations, so no task is at fault, and setting one aside
# deletes the session file — the next iteration would start at iteration 0 with
# a full budget, which makes policy.max_iterations unenforceable while blocking
# the backlog one task at a time. It stops the loop, exactly as it does today,
# and blockers.SESSION_CEILING_CODES refuses it the same way a hard halt is
# refused rather than merely leaving it out of a list.
#
# THE FOURTH HALF (halt-04, 2026-09-01): REFUSED WORK goes back to the agent as
# feedback. post_commit_verification_failed, commit_refused,
# review_feedback_unchanged, review_packet_build_failed, approved_paths_missing,
# push_not_descendant and push_tree_mismatch are not transport faults, stale
# records or spent budgets — each is the loop telling an agent WHY what it
# produced was refused, and then parking so a human can relay that reason. A
# refusal is feedback, so each is instead re-dispatched as a `revise` carrying
# the refusal's own text, verbatim, under a header saying no reviewer wrote it.
# Measured 2026-08-24: post_commit_verification_failed 7 parks / 14.0h;
# review_feedback_unchanged 4 parks / 35.4h at a median of 5.92h, the highest of
# any code.
#
# AND IT IS BOUNDED, which is the harder half. Each of the seven allows exactly
# ONE self-issued revise per task and refusal identity — a digest of the
# refusal's (code, question, detail), written to the blocker record when the
# revise is issued and counted back across EVERY blocker record on disk, closed
# ones included, so answering or archiving a record refunds nothing. The SAME
# refusal arriving again sets the task aside instead; a DIFFERENT complaint under
# the same code is feedback the agent has never been given and gets its own
# revise. The revise deliberately does not close its own blocker — a round
# completing means the round ran, not that the refusal cleared — so the record
# stays open and `python -m autoloop blockers` lists it until it is answered or
# the task is set aside. Nothing is rolled back, discarded or pushed on this
# path: a revise continues the same execution record on the same branch, and the
# round it runs is gated by the same review-round cap, attempt budget and
# repeated-feedback check a reviewer's revise passes.
#
# Two of the seven have a SECOND site that names no task — the changeset arms of
# push_not_descendant and push_tree_mismatch, since an operator's changeset has
# no roadmap task. There is nothing to revise there, so those park exactly as
# they do today.
#
# WHAT IT COSTS, since "the loop keeps going" has a price here. A condition that
# is really loop-wide rather than task-shaped — a git environment broken for
# every worker, a reviewer refusing everything — walks the backlog setting each
# task aside in turn, until nothing is ready and `run --continuous` exits 0
# printing the open blockers. Bounded and visible, but more churn than the
# single stop it replaces. Every question is still recorded, still listed by
# `python -m autoloop blockers`, and still answerable.
enabled = false

# A CEILING on the per-code retry budgets in blockers.AUTONOMOUS_RECOVERIES,
# never a floor: the effective budget is min(the code's own allowance, this).
# Set it to 0 to keep the set-aside behaviour with no retries at all — that also
# switches off the halt-03 rebuild and the halt-04 self-issued revise, which is
# how an operator keeps the set-aside without letting the loop act. Raising it
# above a code's own number changes nothing, because config may restrain the
# table and never widen it.
max_recovery_attempts = 2

[repo]
# What the loop cannot infer about the repository it is pointed at. Every value
# below defaults to the constant that used to be hardcoded for this repository,
# so omitting the whole section behaves exactly as the loop did before it
# existed — and filling it in is what lets the loop run against a different
# repository at all.
#
# NOTHING HERE GRANTS AUTHORITY. Each setting says WHERE to read something the
# repository itself states; none of them decides what an agent may write. That
# line is deliberate, and it is why the always-approved documentation trackers
# are NOT a key here: a tracker is granted to every scoped task without being
# named in its approved_paths, and this file lives under the gitignored state
# dir — so an edit here would widen every task's write scope with no diff anyone
# reviews. The list is the fixed TRACKER_PATHS constant in autoloop/tasks.py;
# change it for your repository by editing that constant, which is a reviewed
# commit in your repository's own history (the package is vendored into the repo
# it operates on). `tracker_paths = [...]` was briefly a setting on 2026-08-16
# and was withdrawn in review — a config that still names it LOADS, prints a
# notice saying the value was dropped, and is not affected by it. See
# docs/SECURITY.md S31.
#
# Where this repo declares its APPLICATION database, and the key inside that
# file. Used for exactly one refusal: a paths.validation_env_file below whose
# DB_NAME equals the name declared here — i.e. validation pointed at the real
# database, which the test suite would create and delete rows in.
#
# WHERE to look, never WHAT to refuse: the forbidden name is still read out of
# the repository, so this cannot be used to forbid a name the repo does not
# actually declare. Set env_example_file = "" if your repo declares no such
# name anywhere; the refusal then does not apply (same as the file being
# absent), and a dedicated throwaway database is entirely your responsibility.
# That opt-out is the EXACT empty string only — a blank-looking "   " is refused
# at load rather than read as one, so the guard is never switched off by a typo.
env_example_file = ".env.example"
env_example_db_key = "DB_NAME"
# Where the dashboard's "Audit findings" panel — and `python -m autoloop intake
# audit` — read findings from. A glob relative to the repo root; the NEWEST
# match by name wins, which works because these reports are date-stamped. The
# panel shows the OUTSTANDING findings only: one that has been promoted,
# recorded already done or declined leaves it. The exact empty string leaves
# the panel empty, which is the right reading for a repo that files no audit
# reports; padding is refused here too, for the same reason.
audit_report_glob = "docs/AUDIT_*.md"
# Where THIS repository ships the per-domain charters its audit agents are
# briefed with — the brief that names your architecture, your trackers, your
# known traps, which is the difference between findings worth reading and
# generic advice. Relative to the repo root, one file, no globs.
#
# This repository SHIPS that file, so leaving this setting at its default is
# what makes its own audits read the brief from the repository rather than from
# code. OPTIONAL nonetheless, and absent is not an error: with no file there,
# the audit uses the built-in charters in autoloop/audit/executor.py
# (DEFAULT_DOMAINS), exactly as it did before this setting existed. Pointing the
# loop at a DIFFERENT repository is the case that fallback exists for — those
# built-ins describe the language-learning app, so auditing anything else with
# them produces a report that reads as complete and describes the wrong
# codebase. When the charters DO come from a file, the agent prompt's opening
# sentence stops naming this project too; the file is where a repository says
# what it is.
#
# Format (docs/AUTOLOOP.md §7, "Domain charters"): one [[domain]] table per domain, in wave
# order, each with slug/title/charter/model and nothing else. `model` is
# "haiku", "sonnet" or "" (the CLI default) — the lead's tier is deliberately
# not delegated to. The file is read READ-ONLY, once per run, from the root of
# the checkout being audited, and a file that exists but does not parse ABORTS
# the audit rather than quietly falling back to the built-ins. So does a
# directory or an unreadable entry at that path: only genuine absence selects
# the fallback, because reading a wrong-type entry as "ships no charters" is the
# same silent degradation wearing a different hat.
#
# The exact empty string means "never look, always use the built-ins"; padding
# is refused rather than read as that opt-out, as above.
audit_charters_file = "docs/audit_charters.toml"
# Where the APPLICATION's test suite lives, and how to run it. Read by exactly
# one consumer: `python -m autoloop intake audit promote`, which turns an audit
# finding into a runnable registry task (docs/AUTOLOOP.md, "Audit finding
# intake").
#
# WHY A PROMOTED TASK NEEDS BOTH. Measured 2026-08-17, the product tasks on the
# roadmap were not runnable: rt-09, rt-13 and rt-14 each had ONE approved path
# and ZERO validation commands, and rt-15 had four paths and no validation. A
# task that narrow hits the attempt ceiling instead of finishing — narrow
# approved_paths caused five separate ceiling jams on 2026-08-15/16 — and a
# review packet with no validation evidence is refused by the reviewer, which
# cost two tasks five rounds each. So intake adds the test tree to every
# promoted task's scope (a finding is satisfied by a change PLUS the test that
# proves it) and declares real validation on it.
#
# WHICH tree is decided mechanically from the finding's own files: anything
# under autoloop/ is about the loop and gets autoloop/tests/ with the commands
# in [audit].validation_commands above; everything else is about the
# application and gets these two. A finding spanning both gets both.
#
# No trailing slash on app_test_root — the '/' that makes it a directory prefix
# is added where it is used. The exact empty string means this repository ships
# no application suite; an app finding is then REFUSED promotion, with the
# reason, rather than promoted with a scope too narrow to work in.
app_test_root = "tests"
# argv lists, the same shape as [audit].validation_commands, and restricted to
# the same binaries by the validation runner. An empty list means the same as an
# empty app_test_root: refuse to promote rather than file an ungradeable task.
app_validation = [
  ["python3", "-m", "pytest", "tests/", "-q", "-p", "no:cacheprovider"],
]

[notify]
# Email you when the loop's STATUS CHANGES, sent by the loop itself from
# heartbeat.publish — the one chokepoint every status update already passes
# through, so a new call site cannot forget to notify.
#
# WHAT IT COVERS, AND WHAT IT CANNOT. Read this before you rely on it. The mail
# is a SELF-REPORT, so it covers exactly what the loop KNOWS: a park, a block,
# a pause, a clean stop, and task/phase transitions. It does NOT cover the loop
# having HUNG, CRASHED or been KILLED — a loop in that state sends no mail for
# the same reason it writes no heartbeat, and no timer, thread or subprocess
# inside the loop can fix that. Only something OUTSIDE the process sees silence:
# that is scripts/autoloop_health_notify.sh, which reads the heartbeat file and
# nothing else, and it is why that script exists. Mail arriving means the loop
# is alive. Mail NOT arriving means nothing at all.
#
# WHEN IT SENDS: on a CHANGE of (status, phase, task id, decision) against the
# last one observed, which is persisted beside the heartbeat file — so a
# restart does not re-send the state it already sent. Observed cadence is one
# change every 15-45 minutes. `publish` is called from the hot loop, and an
# unchanged tuple costs one file read and sends nothing.
#
# WHAT IT COSTS WHEN IT BREAKS: nothing that can end a round. Every failure is
# swallowed and logged to stderr, one send is attempted and never retried, and
# timeout_seconds below is a hard bound on that attempt.
#
# OFF by default. An unconfigured loop must not try to send.
enabled = false
# Who gets the mail, and who it is from. Required when enabled = true.
recipient = ""
sender = ""
# The SMTP server. 587 with tls = "starttls", or 465 with tls = "ssl".
host = ""
port = 587
# "starttls" or "ssl". There is deliberately NO "none": authentication is
# mandatory (below), so a cleartext session would put your password on the wire.
tls = "starttls"
# The SMTP account. Required when enabled = true — a send with no credential is
# REFUSED, never quietly attempted unauthenticated.
username = ""
#
# THE PASSWORD IS NOT IN THIS FILE, and there is no key for it: `password = ...`
# here is refused at load with the remedy. Name WHERE the password lives, using
# exactly one of the two settings below.
#
#   * password_env — the name of an environment variable in the loop's own
#     environment (launchd: an EnvironmentVariables entry, or a wrapper that
#     exports it). Nothing writes it to disk.
#   * password_file — a path to a file whose FIRST LINE is the password. Keep it
#     outside the checkout and readable only by you (`chmod 600`).
#
# Unset, empty, blank or unreadable is not a fallback: the send is refused with
# a message on stderr saying which source was empty. The password is never
# logged, never written to the heartbeat, and never included in an error string.
password_env = ""
password_file = ""
# The hard bound on ONE send, in seconds, and the entire cost of a dead SMTP
# server: the attempt is abandoned at this point, the round continues, and
# nothing is retried. At most 60; a few seconds is the intended shape.
timeout_seconds = 10.0
# WHICH statuses mail. All five by default — the task and phase transitions
# inside "running" are the cadence above. For attention-only mail, narrow it to
# ["parked", "blocked", "paused"]. An EMPTY list is refused: it would read as
# configured while sending nothing; use enabled = false to switch mail off.
statuses = ["running", "paused", "parked", "blocked", "stopped"]

[paths]
# Runtime state (state.json, tasks.json, transcript.jsonl, diagnostics/, PAUSE).
state_dir = ".autoloop"
# REQUIRED, no default. Where each task's isolated worker repository lives.
# MUST be an absolute path OUTSIDE this checkout, its .git (including the
# real git-common-dir a linked worktree's .git file points at), the state
# dir above, and the publisher repo/hooks dirs — `doctor` and every real run
# refuse otherwise, and never silently fall back to the old
# `<state_dir>/workers` location. `~` is expanded. See docs/SECURITY.md
# (Autoloop M1 finding #1): a worker repo nested inside the checkout is
# invisible to every git-based verification primitive scoped to it, so a
# write outside the worker repo but inside the checkout would go undetected.
workers_root = "~/.autoloop/workers"
# OPTIONAL. Absolute path to a file holding the DEDICATED TEST database
# credentials that post-writer validation runs under. Set this only when a
# task's declared validation needs a database (e.g. the backend suite); leave
# it unset and validation runs with no credentials at all.
#
# The file must define EXACTLY these six names and nothing else:
#
#   DB_HOST=127.0.0.1
#   DB_PORT=5432
#   DB_NAME=REPLACE_WITH_A_DEDICATED_TEST_DATABASE
#   DB_USER=REPLACE_ME
#   DB_PASSWORD=REPLACE_ME_MIN_8_CHARS
#   SECRET_KEY=REPLACE_ME_MIN_8_CHARS_JWT_SIGNING_KEY
#
# Refused, deliberately: any other key (so this can never become a channel
# for ANTHROPIC_API_KEY or another provider credential), a duplicate key, a
# missing key, a malformed line, an empty value, a symlink, a file not owned
# by you, any group/world permission bit (`chmod 600`), a path inside this
# checkout / the state dir / workers_root / the publisher dirs, and a DB_NAME
# equal to the application database name this repo declares (read from
# [repo].env_example_file / env_example_db_key above).
#
# The database is created, written to and deleted from by the test suite. Use
# a throwaway database, NOT the one the app runs on, and do NOT point this at
# your real `.env` — it holds provider keys this boundary exists to keep out.
# The write-capable agent subprocess has these variables explicitly removed
# from its environment and never learns this path.
# validation_env_file = "~/.autoloop/validation.env"

# [projects]
# OPTIONAL, and only read by `python -m autoloop projects` — the one status view
# across every loop you run (docs/AUTOLOOP.md, "One view across projects").
#
# Each entry is the CONFIG FILE of another loop: its own state_dir, its own
# checkout, its own branch. From that one path the view resolves everything else
# by the loop's own rules, so adding a fifth project is a line here rather than a
# code change. Paths must be ABSOLUTE (`~` is expanded): the command is run from
# wherever you are standing, and a relative entry would name a different file
# each time.
#
# The view is READ-ONLY and takes no lock — safe to run against a loop that is
# mid-round — and a project whose config is missing or unreadable is reported as
# `unknown` with the reason while every other project still renders.
#
# Listing this deployment's OWN config here is allowed and shows it as one more
# row; nothing reads this section recursively.
# configs = [
#   "~/code/project-a/.autoloop/config.toml",
#   "~/code/project-b/.autoloop/config.toml",
# ]
