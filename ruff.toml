# Pinned deliberately. Ruff's built-in defaults are narrower (E4/E7/E9 + F) and
# shift between releases, so an unpinned rule set reports differently
# machine-to-machine. The version itself is pinned in .github/workflows/tests.yml.
#
# E501 (line-too-long) is OFF on purpose: turning it on reports a repo-wide
# reflow's worth of pre-existing violations, which is a formatting decision
# rather than a lint fix. Import sorting (I) is off for the same reason.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F"]
ignore = ["E501"]
